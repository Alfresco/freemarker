name: Publish to Nexus

permissions:
  contents: read

on:
  push:
    branches: [ '*-alfresco-patched' ]

jobs:
  publish:
    if: contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: 8
          distribution: temurin

      - name: Set up JDK 16
        uses: actions/setup-java@v4
        with:
          java-version: 16
          distribution: zulu

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: oracle

      - name: Validate Gradle wrapper
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      # version.properties' mavenVersion drives project.version, which the "main"
      # MavenPublication below (build.gradle.kts:337) uses as-is -- so we append the
      # Alfresco suffix here rather than maintaining a second copy of the version string.
      - name: Set Alfresco patch version
        run: |
          BASE_VERSION=$(grep '^mavenVersion=' freemarker-core/src/main/resource-templates/freemarker/version.properties | cut -d'=' -f2)
          sed -i "s/^mavenVersion=.*/mavenVersion=${BASE_VERSION}-alfresco-patched-2/" freemarker-core/src/main/resource-templates/freemarker/version.properties

      # Publishes via Gradle's own "main" MavenPublication (build.gradle.kts:337), which
      # already carries the real upstream Apache FreeMarker POM metadata (license, url,
      # scm, etc.) -- no need to hand-author a POM or shell out to Maven for this.
      - name: Publish jar + sources + pom to Nexus
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          ./gradlew "-Pfreemarker.signMethod=none" "-Pfreemarker.allowUnsignedReleaseBuild=true" \
            "-PfreemarkerDeployUrl=https://nexus.alfresco.com/nexus/service/local/repositories/thirdparty" \
            "-PfreemarkerDeployServerId=nexusThirdparty" \
            "-Pfreemarker.deploy.apache.user=${NEXUS_USERNAME}" \
            "-Pfreemarker.deploy.apache.password=${NEXUS_PASSWORD}" \
            publishMainPublicationToNexusThirdpartyRepository
