name: Publish to Nexus

permissions:
  contents: read

on:
  push:
    branches: [ '*-alfresco-patched' ]

jobs:
  publish:
    if: contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: 8
          distribution: temurin

      - name: Set up JDK 16
        uses: actions/setup-java@v4
        with:
          java-version: 16
          distribution: zulu

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: oracle

      - name: Validate Gradle wrapper
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      # version.properties' mavenVersion drives project.version, which the "main"
      # MavenPublication below (build.gradle.kts:337) uses as-is -- so we append the
      # Alfresco suffix here rather than maintaining a second copy of the version string.
      - name: Set Alfresco patch version
        run: |
          BASE_VERSION=$(grep '^mavenVersion=' freemarker-core/src/main/resource-templates/freemarker/version.properties | cut -d'=' -f2)
          sed -i "s/^mavenVersion=.*/mavenVersion=${BASE_VERSION}-alfresco-patched-2/" freemarker-core/src/main/resource-templates/freemarker/version.properties
          PUBLISH_VERSION=$(grep '^mavenVersion=' freemarker-core/src/main/resource-templates/freemarker/version.properties | cut -d'=' -f2)
          echo "PUBLISH_VERSION=${PUBLISH_VERSION}" >> "$GITHUB_ENV"

      - name: Build jar, sources jar and pom
        run: './gradlew "-Pfreemarker.signMethod=none" "-Pfreemarker.allowUnsignedReleaseBuild=true" clean jar sourcesJar generatePomFileForMainPublication'

      # Gradle's HTTP client doesn't trust nexus.alfresco.com's certificate chain
      # (PKIX path building failed), unlike Maven's deploy path which already works here --
      # so the actual upload stays on Maven; we only borrow the POM Gradle generated above
      # (build.gradle.kts:337's "main" publication -- the real upstream Apache FreeMarker
      # license/url/scm metadata) instead of hand-authoring one.
      - name: Set up Maven settings.xml for Nexus
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          server-id: nexus-thirdparty
          server-username: NEXUS_USERNAME
          server-password: NEXUS_PASSWORD

      - name: Deploy jar + sources to Nexus
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          mvn org.apache.maven.plugins:maven-deploy-plugin:2.8.2:deploy-file \
            -Durl="https://nexus.alfresco.com/nexus/service/local/repositories/thirdparty" \
            -DrepositoryId="nexus-thirdparty" \
            -Dfile="build/libs/freemarker-${PUBLISH_VERSION}.jar" \
            -DpomFile="build/publications/main/pom-default.xml" \
            -DcreateChecksum=true \
            -Dsources="build/libs/freemarker-${PUBLISH_VERSION}-sources.jar"
